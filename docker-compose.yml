# Values in ${...} come from the root .env (copy .env.example). Values shared by several services
# live there; each service may also have its own .env with settings only it needs.

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set it in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set it in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set it in .env}
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  s3:
    image: pgsty/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?set it in .env}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?set it in .env}
    ports:
      - "${S3_HOST_PORT:-9000}:9000"
      - "${S3_CONSOLE_HOST_PORT:-9001}:9001"
    volumes:
      - s3_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  data_provider:
    build: ./data_provider
    env_file: ./data_provider/.env
    # Overrides the same variables from data_provider/.env with the addresses inside this network.
    environment:
      PORT: 8030
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      S3_ENDPOINT: http://s3:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET:?set it in .env}
      BITRIX_WEBHOOK_URL: ${BITRIX_WEBHOOK_URL:?set it in .env}
    ports:
      - "${DATA_PROVIDER_HOST_PORT:-8030}:8030"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      s3:
        condition: service_healthy

volumes:
  postgres_data:
  s3_data:
