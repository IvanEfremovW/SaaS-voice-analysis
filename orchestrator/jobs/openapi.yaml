openapi: 3.1.0
info:
  title: Очередь обработки звонков
  version: 0.1.0
paths:
  /api/v1/jobs:
    post:
      summary: Submit Job
      operationId: submit_job_api_v1_jobs_post
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_submit_job_api_v1_jobs_post'
        required: true
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobAccepted'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/jobs/by-path:
    post:
      summary: Submit By Path
      operationId: submit_by_path_api_v1_jobs_by_path_post
      parameters:
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ByPathRequest'
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobAccepted'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/jobs/variants:
    get:
      summary: List Variants
      operationId: list_variants_api_v1_jobs_variants_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/JobVariant'
                type: array
                title: Response List Variants Api V1 Jobs Variants Get
  /api/v1/jobs/{job_id}:
    get:
      summary: Get Job
      operationId: get_job_api_v1_jobs__job_id__get
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Job Id
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    Body_submit_job_api_v1_jobs_post:
      properties:
        file:
          type: string
          contentMediaType: application/octet-stream
          title: File
        mode:
          type: string
          enum:
          - vad
          - stt
          - pipeline
          title: Mode
          default: pipeline
        variant_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Variant Id
        device:
          anyOf:
          - type: string
            enum:
            - cpu
            - gpu
          - type: 'null'
          title: Device
        vad:
          anyOf:
          - type: string
            enum:
            - silero
            - webrtc
            - energy
          - type: 'null'
          title: Vad
        language:
          anyOf:
          - type: string
          - type: 'null'
          title: Language
        beam_size:
          anyOf:
          - type: integer
            maximum: 10.0
            minimum: 1.0
          - type: 'null'
          title: Beam Size
        condition_on_previous_text:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Condition On Previous Text
        initial_prompt:
          anyOf:
          - type: string
          - type: 'null'
          title: Initial Prompt
        include_audio_base64:
          type: boolean
          title: Include Audio Base64
          default: false
      type: object
      required:
      - file
      title: Body_submit_job_api_v1_jobs_post
    ByPathRequest:
      properties:
        mode:
          type: string
          enum:
          - vad
          - stt
          - pipeline
          title: Mode
          default: pipeline
        variant_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Variant Id
        device:
          anyOf:
          - type: string
            enum:
            - cpu
            - gpu
          - type: 'null'
          title: Device
        vad:
          anyOf:
          - type: string
            enum:
            - silero
            - webrtc
            - energy
          - type: 'null'
          title: Vad
        language:
          anyOf:
          - type: string
          - type: 'null'
          title: Language
        beam_size:
          anyOf:
          - type: integer
            maximum: 10.0
            minimum: 1.0
          - type: 'null'
          title: Beam Size
        condition_on_previous_text:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Condition On Previous Text
        initial_prompt:
          anyOf:
          - type: string
          - type: 'null'
          title: Initial Prompt
        include_audio_base64:
          type: boolean
          title: Include Audio Base64
          default: false
        file_path:
          type: string
          title: File Path
        output_wav_path:
          anyOf:
          - type: string
          - type: 'null'
          title: Output Wav Path
      additionalProperties: false
      type: object
      required:
      - file_path
      title: ByPathRequest
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    Job:
      properties:
        job_id:
          type: string
          format: uuid
          title: Job Id
        status:
          type: string
          enum:
          - queued
          - running
          - succeeded
          - failed
          title: Status
        result:
          anyOf:
          - $ref: '#/components/schemas/TranscriptionResult'
          - type: 'null'
        error:
          anyOf:
          - type: string
          - type: 'null'
          title: Error
        mode:
          anyOf:
          - type: string
            enum:
            - vad
            - stt
            - pipeline
          - type: 'null'
          title: Mode
        preprocessing:
          anyOf:
          - $ref: '#/components/schemas/PreprocessResponse'
          - type: 'null'
      type: object
      required:
      - job_id
      - status
      title: Job
    JobAccepted:
      properties:
        job_id:
          type: string
          format: uuid
          title: Job Id
        status:
          type: string
          const: queued
          title: Status
          default: queued
        status_url:
          type: string
          title: Status Url
      type: object
      required:
      - job_id
      - status_url
      title: JobAccepted
    JobVariant:
      properties:
        id:
          type: string
          pattern: ^[a-zA-Z0-9_-]+$
          title: Id
        label:
          type: string
          title: Label
        description:
          type: string
          title: Description
        engine:
          type: string
          enum:
          - whisper
          - tone
          title: Engine
        options:
          additionalProperties: true
          type: object
          title: Options
        supported_devices:
          items:
            type: string
            enum:
            - cpu
            - gpu
          type: array
          title: Supported Devices
      additionalProperties: false
      type: object
      required:
      - id
      - label
      - description
      - engine
      - options
      - supported_devices
      title: JobVariant
    PreprocessResponse:
      properties:
        sample_rate:
          type: integer
          title: Sample Rate
          description: Частота дискретизации выходного потока (Гц)
          examples:
          - 16000
        original_duration:
          type: number
          title: Original Duration
          description: Длительность исходной аудиозаписи (сек)
          examples:
          - 35.07
        speech_duration:
          type: number
          title: Speech Duration
          description: Суммарная длительность чистой речи после VAD (сек)
          examples:
          - 28.74
        retention_pct:
          type: number
          title: Retention Pct
          description: Процент сохраненного аудиопотока после удаления тишины (0..100%)
          examples:
          - 81.95
        segments_count:
          type: integer
          title: Segments Count
          description: Количество обнаруженных речевых сегментов
          examples:
          - 8
        speech_segments:
          items:
            $ref: '#/components/schemas/SpeechSegmentDTO'
          type: array
          title: Speech Segments
          description: Список временных границ речи относительно исходного файла
        output_wav_path:
          anyOf:
          - type: string
          - type: 'null'
          title: Output Wav Path
          description: Путь к сохраненному WAV-файлу с чистой речью (если был указан
            в запросе)
          examples:
          - /data/processed/call_speech_only.wav
        audio_wav_base64:
          anyOf:
          - type: string
          - type: 'null'
          title: Audio Wav Base64
          description: Очищенное речевое аудио в формате WAV (16kHz PCM_16), закодированное
            в Base64
          examples:
          - null
      type: object
      required:
      - sample_rate
      - original_duration
      - speech_duration
      - retention_pct
      - segments_count
      - speech_segments
      title: PreprocessResponse
      description: Схема ответа предобработки и VAD аудиофайла.
    SpeechSegmentDTO:
      properties:
        start:
          type: number
          title: Start
          description: Начало речевого интервала в исходном файле (сек)
          examples:
          - 1.762
        end:
          type: number
          title: End
          description: Конец речевого интервала в исходном файле (сек)
          examples:
          - 2.334
      type: object
      required:
      - start
      - end
      title: SpeechSegmentDTO
      description: Временной интервал обнаруженной речи относительно исходной записи.
    TranscriptionResult:
      properties:
        text:
          type: string
          title: Text
          description: Полный объединенный текст звонка
        language:
          type: string
          title: Language
          description: Распознанный язык речи (ISO 639-1 код, например, 'ru')
        language_probability:
          type: number
          title: Language Probability
          description: Уверенность модели в определенном языке
        duration:
          type: number
          title: Duration
          description: Длительность обработанного аудио в секундах
        segments:
          items:
            $ref: '#/components/schemas/TranscriptionSegment'
          type: array
          title: Segments
          description: Список детализированных речевых сегментов
        utterances:
          items:
            $ref: '#/components/schemas/TranscriptionUtterance'
          type: array
          title: Utterances
          description: Строки по паузам и окончаниям фраз на той же шкале времени
          readOnly: true
      type: object
      required:
      - text
      - language
      - language_probability
      - duration
      - utterances
      title: TranscriptionResult
      description: Итоговый результат транскрибации аудиозаписи.
    TranscriptionSegment:
      properties:
        id:
          type: integer
          title: Id
          description: Порядковый номер сегмента (0, 1, 2...)
        start:
          type: number
          title: Start
          description: Время начала сегмента в секундах (округление до 3 знаков)
        end:
          type: number
          title: End
          description: Время окончания сегмента в секундах (округление до 3 знаков)
        text:
          type: string
          title: Text
          description: Очищенный текст сегмента без лишних пробелов
        avg_logprob:
          type: number
          title: Avg Logprob
          description: Средняя лог-вероятность токенов (метрика уверенности)
        no_speech_prob:
          type: number
          title: No Speech Prob
          description: Вероятность отсутствия речи в данном сегменте
        words:
          items:
            $ref: '#/components/schemas/TranscriptionWord'
          type: array
          title: Words
      type: object
      required:
      - id
      - start
      - end
      - text
      - avg_logprob
      - no_speech_prob
      title: TranscriptionSegment
      description: Сегмент транскрибированной речи с временными метками и метаданными
        качества.
    TranscriptionUtterance:
      properties:
        text:
          type: string
          title: Text
        start:
          type: number
          title: Start
        end:
          type: number
          title: End
      type: object
      required:
      - text
      - start
      - end
      title: TranscriptionUtterance
    TranscriptionWord:
      properties:
        text:
          type: string
          title: Text
        start:
          type: number
          title: Start
        end:
          type: number
          title: End
        probability:
          type: number
          title: Probability
      type: object
      required:
      - text
      - start
      - end
      - probability
      title: TranscriptionWord
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
